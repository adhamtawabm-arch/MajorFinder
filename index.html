function category(c){if(c.includes('Engineering'))return'Engineering';if(c.includes('Technology'))return'Technology';if(c.includes('Health'))return'Health';if(c.includes('Science'))return'Science';if(c.includes('Business'))return'Business';if(c.includes('Humanities'))return'Humanities & Languages';if(c.includes('Social'))return'Social Sciences';if(c.includes('Creative')||c.includes('Design'))return'Creative';if(c.includes('Education'))return'Education';if(c.includes('Environment'))return'Environment';return'Interdisciplinary'}
function searchSub(s,q){if(!q)return true;q=q.toLowerCase().trim();let f=[s.name.en,s.name.ar,s.name.fr,s.name.es,...s.aliases].filter(Boolean).join(' ').toLowerCase();if(f.includes(q))return true;let d=(a,b)=>{let r=[...Array(b.length+1)].map((_,i)=>i);for(let i=1;i<=a.length;i++){let n=[i];for(let j=1;j<=b.length;j++)n[j]=Math.min(r[j]+1,n[j-1]+1,r[j-1]+(a[i-1]===b[j-1]?0:1));r=n}return r[b.length]};return f.split(/[\s,/-]+/).some(t=>t.length>2&&(t.startsWith(q)||d(t,q)<=((q.length>5)?2:1)))}
function filtered(){return SUBJECTS.filter(s=>(S.cat==='All'||s.categories.includes(S.cat))&&searchSub(s,S.q))}
function select(id){if(S.selected.includes(id)){S.selected=S.selected.filter(x=>x!==id);render();return}if(S.selected.length>=3){toast('You already chose 3 subjects. Remove one to change your selection.');return}S.selected.push(id);render()}
function match(m){
 if(!S.selected.length)return 0;let total=0;
 S.selected.forEach(id=>{let x=sub(id),v=m.subjects[id]||0,t=(x?.interestTags||[]).filter(z=>m.interestTags.includes(z)).length;total+=v*.78+Math.min(1,t/3)*.12+(m.skills.some(k=>(x?.relatedSkills||[]).includes(k))?.10:0)});
 total/=S.selected.length;
 let sy=0,p=0;for(let i=0;i<S.selected.length;i++)for(let j=i+1;j<S.selected.length;j++){sy+=Math.sqrt((m.subjects[S.selected[i]]||0)*(m.subjects[S.selected[j]]||0));p++}if(p)total=.84*total+.16*sy/p;
 if(S.prefs.length){let hit=S.prefs.filter(x=>m.interestTags.includes(x)||m.skills.some(k=>k.toLowerCase().includes(x.replace('_',' ')))).length;total+=Math.min(.10,hit/S.prefs.length*.10)}
 return Math.round(Math.max(0,Math.min(.99,total))*100)
}
function why(m){return S.selected.map(id=>{let x=sub(id),v=Number((m.subjects&&m.subjects[id])||0);if(!x)return '';return`✓ ${x.name.en} — ${v>=.85?'Very relevant':v>=.65?'Highly relevant':v>=.45?'Useful':'Connected'}`}).filter(Boolean).slice(0,5)}
function calculate(){
  if(S.selected.length!==3){toast('Please choose exactly 3 subjects.');return}
  S.page='calc';render();
  const selected=[...S.selected], prefsSnapshot=[...S.prefs];
  // Ultra-fast, defensive scoring: only 3 selected subjects are evaluated per major.
  const scoreMajor=(m)=>{
    try{
      const subjects=m&&m.subjects&&typeof m.subjects==='object'?m.subjects:{};
      const tags=Array.isArray(m.interestTags)?m.interestTags:[];
      const skills=Array.isArray(m.skills)?m.skills:[];
      let base=0, count=0;
      for(const id of selected){
        const x=sub(id); if(!x) continue;
        const v=Number(subjects[id])||0;
        const tagHits=(Array.isArray(x.interestTags)?x.interestTags:[]).reduce((n,t)=>n+(tags.includes(t)?1:0),0);
        const skillHit=skills.some(k=>Array.isArray(x.relatedSkills)&&x.relatedSkills.includes(k))?1:0;
        base += v*.70 + Math.min(tagHits/2,1)*.18 + skillHit*.12;
        count++;
      }
      base=count?base/count:0;
      // Small general-interest floor means unrelated combinations still get useful options.
      base=Math.max(base,.22);
      if(prefsSnapshot.length){
        const hits=prefsSnapshot.reduce((n,p)=>n+(tags.includes(p)||skills.some(k=>String(k).toLowerCase().includes(p.replaceAll('_',' ')))?1:0),0);
        base+=Math.min(.08,hits/prefsSnapshot.length*.08);
      }
      return Math.round(Math.max(22,Math.min(99,base*100)));
    }catch(e){return 22}
  };
  try{
    S.results=MAJORS.map(m=>({...m,score:scoreMajor(m)})).sort((a,b)=>b.score-a.score);
  }catch(e){
    S.results=MAJORS.slice(0,20).map(m=>({...m,score:22}));
  }
  // Results are ready immediately; no long artificial loading delay.
  S.page='results';render();
}

function universitiesFor(m){const q=(S.uniQuery||'').trim().toLowerCase(),city=(S.uniCity||'').trim().toLowerCase();return UNIVERSITIES.filter(u=>{const text=(u.name+' '+u.city+' '+u.country).toLowerCase();const location=!city||u.city.toLowerCase().includes(city)||u.country.toLowerCase().includes(city);const search=!q||text.includes(q);return location&&search&&uniAvailable(u,m)}).map(u=>({...u,majorScore:uniStrength(u,m),sameCity:city&&u.city.toLowerCase()===city})).sort((a,b)=>(b.sameCity?1:0)-(a.sameCity?1:0)||b.majorScore-a.majorScore)}

function renderDetail(){let m=major(S.detail),score=match(m),rel=m.relatedMajors.map(major).filter(Boolean).slice(0,4);return`<section class="pt-32 pb-20 min-h-screen"><div class="max-w-5xl mx-auto px-5"><button onclick="S.page='results';render()" class="text-sm text-slate-400">← Back to matches</button><div class="glass rounded-[2rem] p-7 sm:p-10 mt-5"><div class="flex flex-col sm:flex-row gap-6"><div class="w-20 h-20 rounded-3xl bg-white/5 grid place-items-center text-4xl">${(sub(Object.keys(m.subjects)[0])||{}).icon||'✦'}</div><div class="flex-1"><div class="text-cyan-200 text-sm">${esc(category(m.category))}</div><h1 class="text-4xl sm:text-5xl font-semibold mt-1">${esc(m.name.en)}</h1><p class="text-slate-400 text-lg mt-4">${esc(m.description)}</p></div><div class="text-5xl font-bold text-grad">${score}%</div></div><div class="grid md:grid-cols-2 gap-4 mt-9"><div class="bg-white/5 rounded-2xl p-5"><h2 class="font-semibold">Why it matches you</h2><div class="space-y-2 mt-4 text-sm text-slate-300">${why(m).map(esc).map(x=>`<div>${x}</div>`).join('')}</div></div><div class="bg-white/5 rounded-2xl p-5"><h2 class="font-semibold">You might enjoy</h2><div class="flex flex-wrap gap-2 mt-4">${m.interestTags.map(x=>`<span class="px-3 py-1.5 rounded-full bg-cyan-300/10 text-cyan-100 text-xs">${esc(x.replaceAll('_',' '))}</span>`).join('')}</div></div></div><div class="grid md:grid-cols-2 gap-4 mt-4"><div class="bg-white/5 rounded-2xl p-5"><h2 class="font-semibold">Skills involved</h2><div class="grid grid-cols-2 gap-2 mt-4 text-sm text-slate-400">${m.skills.map(x=>`<div>• ${esc(x)}</div>`).join('')}</div></div><div class="bg-white/5 rounded-2xl p-5"><h2 class="font-semibold">Possible careers</h2><div class="space-y-2 mt-4 text-sm text-slate-400">${m.careerPaths.map(x=>`<div>→ ${esc(x)}</div>`).join('')}</div></div></div><div class="flex gap-2 mt-7"><button onclick="save('${m.id}')" class="btn bg-white text-slate-950 rounded-xl px-5 py-3 font-semibold">${S.saved.includes(m function renderSaved(){let a=S.saved.map(major).filter(Boolean).map(m=>({...m,score:match(m)}));return`<section class="pt-32 pb-20 min-h-screen"><div class="max-w-7xl mx-auto px-5"><p class="text-cyan-200 text-sm uppercase tracking-[.2em]">Your shortlist</p><h1 class="text-5xl sm:text-6xl font-semibold mt-2">My Saved Majors</h1><p class="text-slate-400 mt-4">Saved locally on this device — no account required.</p>${a.length?`<div class="grid lg:grid-cols-2 gap-4 mt-8">${a.map(card).join('')}</div>`:`<div class="glass rounded-3xl p-14 text-center mt-8"><div class="text-4xl">♡</div><h2 class="text-xl font-semibold mt-4">You haven't saved any majors yet.</h2><p class="text-slate-500 mt-2">Tap ♡ on a major to keep it here.</p><button onclick="start()" class="btn mt-6 bg-white text-slate-950 rounded-xl px-5 py-3 font-semibold">Find My Majors →</button></div>`}</div></section>`}
function render(){let x=S.page==='home'?renderHome():S.page==='subjects'?renderSubjects():S.page==='prefs'?renderPrefs():S.page==='calc'?renderCalc():S.page==='results'?results():S.page==='detail'?renderDetail():renderSaved();document.getElementById('app').innerHTML=x;persist()}
(function(){if(!window.THREE)return;try{const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,mobile=innerWidth<700,c=document.getElementById('three'),r=new THREE.WebGLRenderer({canvas:c,alpha:true,antialias:!mobile});r.setPixelRatio(Math.min(devicePixelRatio,mobile?1.2:1.6));r.setSize(innerWidth,innerHeight);const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);cam.position.z=10;const g=new THREE.Group();sc.add(g);const a=new THREE.MeshBasicMaterial({color:0x5ee7f2,wireframe:true,transparent:true,opacity:.15}),b=new THREE.MeshBasicMaterial({color:0x9b8cff,wireframe:true,transparent:true,opacity:.11});function add(o,m,p,s=1){o.position.set(...p);o.scale.setScalar(s);g.add(o)}add(new THREE.IcosahedronGeometry(1.6,1),a,[-4,1,-1],.9);add(new THREE.TorusKnotGeometry(1.1,.025,80,10),b,[3,2,-2]);add(new THREE.TorusGeometry(1.8,.018,16,80),a,[-3,-4,-1]);add(new THREE.OctahedronGeometry(1.1,1),b,[4,-3,-3]);let n=mobile?220:450,p=new Float32Array(n*3);for(let i=0;i<n;i++){p[i*3]=(Math.random()-.5)*18;p[i*3+1]=(Math.random()-.5)*12;p[i*3+2]=(Math.random()-.5)*10-2}let pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(p,3));sc.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x8bdde7,size:mobile?.018:.023,transparent:true,opacity:.4})));let target=0;addEventListener('scroll',()=>target=scrollY*.0005);function loop(){requestAnimationFrame(loop);if(!reduce){g.rotation.y+=(target-g.rotation.y)*.02;g.rotation.x+=.0005;g.rotation.z+=.00025}r.render(sc,cam)}loop();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})}catch(e){console.warn('3D background disabled:',e)} })();
render();
</script>
