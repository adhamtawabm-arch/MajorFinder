function category(c){if(c.includes('Engineering'))return'Engineering';if(c.includes('Technology'))return'Technology';if(c.includes('Health'))return'Health';if(c.includes('Science'))return'Science';if(c.includes('Business'))return'Business';if(c.includes('Humanities'))return'Humanities & Languages';if(c.includes('Social'))return'Social Sciences';if(c.includes('Creative')||c.includes('Design'))return'Creative';if(c.includes('Education'))return'Education';if(c.includes('Environment'))return'Environment';return'Interdisciplinary'}
function searchSub(s,q){if(!q)return true;q=q.toLowerCase().trim();let f=[s.name.en,s.name.ar,s.name.fr,s.name.es,...s.aliases].filter(Boolean).join(' ').toLowerCase();if(f.includes(q))return true;let d=(a,b)=>{let r=[...Array(b.length+1)].map((_,i)=>i);for(let i=1;i<=a.length;i++){let n=[i];for(let j=1;j<=b.length;j++)n[j]=Math.min(r[j]+1,n[j-1]+1,r[j-1]+(a[i-1]===b[j-1]?0:1));r=n}return r[b.length]};return f.split(/[\s,/-]+/).some(t=>t.length>2&&(t.startsWith(q)||d(t,q)<=((q.length>5)?2:1)))}
function filtered(){return SUBJECTS.filter(s=>(S.cat==='All'||s.categories.includes(S.cat))&&searchSub(s,S.q))}
function select(id){if(S.selected.includes(id)){S.selected=S.selected.filter(x=>x!==id);render();return}if(S.selected.length>=3){toast('You already chose 3 subjects. Remove one to change your selection.');return}S.selected.push(id);render()}
function match(m){
 if(!S.selected.length)return 0;let total=0;
 S.selected.forEach(id=>{let x=sub(id),v=m.subjects[id]||0,t=(x?.interestTags||[]).filter(z=>m.interestTags.includes(z)).length;total+=v*.78+Math.min(1,t/3)*.12+((m.skills||[]).some(k=>(x?.relatedSkills||[]).includes(k))?.10:0)});
 total/=S.selected.length;
 let sy=0,p=0;for(let i=0;i<S.selected.length;i++)for(let j=i+1;j<S.selected.length;j++){sy+=Math.sqrt((m.subjects[S.selected[i]]||0)*(m.subjects[S.selected[j]]||0));p++}if(p)total=.84*total+.16*sy/p;
 if(S.prefs.length){let hit=S.prefs.filter(x=>m.interestTags.includes(x)||m.skills.some(k=>k.toLowerCase().includes(x.replace('_',' ')))).length;total+=Math.min(.10,hit/S.prefs.length*.10)}
 return Math.round(Math.max(0,Math.min(.99,total))*100)
}
function why(m){return S.selected.map(id=>{let x=sub(id),v=Number((m.subjects&&m.subjects[id])||0);if(!x)return '';return`✓ ${x.name.en} — ${v>=.85?'Very relevant':v>=.65?'Highly relevant':v>=.45?'Useful':'Connected'}`}).filter(Boolean).slice(0,5)}
function calculate(){
  if(S.selected.length!==3){toast('Please choose exactly 3 subjects.');return}
  S.page='calc';render();
  const selected=[...S.selected], prefsSnapshot=[...S.prefs];
  // Ultra-fast, defensive scoring: only 3 selected subjects are evaluated per major.
  const scoreMajor=(m)=>{
    try{
      const subjects=m&&m.subjects&&typeof m.subjects==='object'?m.subjects:{};
      const tags=Array.isArray(m.interestTags)?m.interestTags:[];
      const skills=Array.isArray(m.skills)?m.skills:[];
      let base=0, count=0;
      for(const id of selected){
        const x=sub(id); if(!x) continue;
        const v=Number(subjects[id])||0;
        const tagHits=(Array.isArray(x.interestTags)?x.interestTags:[]).reduce((n,t)=>n+(tags.includes(t)?1:0),0);
        const skillHit=skills.some(k=>Array.isArray(x.relatedSkills)&&x.relatedSkills.includes(k))?1:0;
        base += v*.70 + Math.min(tagHits/2,1)*.18 + skillHit*.12;
        count++;
      }
      base=count?base/count:0;
      // Small general-interest floor means unrelated combinations still get useful options.
      base=Math.max(base,.22);
      if(prefsSnapshot.length){
        const hits=prefsSnapshot.reduce((n,p)=>n+(tags.includes(p)||skills.some(k=>String(k).toLowerCase().includes(p.replaceAll('_',' ')))?1:0),0);
        base+=Math.min(.08,hits/prefsSnapshot.length*.08);
      }
      return Math.round(Math.max(22,Math.min(99,base*100)));
    }catch(e){return 22}
  };
  try{
    S.results=MAJORS.map(m=>({...m,score:scoreMajor(m)})).sort((a,b)=>b.score-a.score);
  }catch(e){
    S.results=MAJORS.slice(0,20).map(m=>({...m,score:22}));
  }
  // Results are ready immediately; no long artificial loading delay.
  S.page='results';render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function majorMatchesCategory(m,cat){
  if(cat==='All') return true;
  const c=category(String(m.category||''));
  if(c===cat) return true;
  const raw=String(m.category||'').toLowerCase();
  const map={Engineering:['engineering'],Technology:['technology','computer','software','data','cyber','information'],Health:['health','medical','medicine','nursing','pharmacy'],Science:['science','physics','chemistry','biology','mathematics'],Business:['business','finance','accounting','marketing','management','economics'],['Humanities & Languages']:['humanities','language','linguistics','literature','philosophy','history'],['Social Sciences']:['social','psychology','sociology','political','international'],Creative:['creative','design','art','media','film','music','theatre'],Education:['education','teaching'],Environment:['environment','sustainability','earth','marine']};
  return (map[cat]||[]).some(k=>raw.includes(k)) || String(m.name?.en||'').toLowerCase().includes(cat.toLowerCase());
}
function results(){
  let a=S.results.filter(m=>majorMatchesCategory(m,S.cat));

function getUniversityRows(m){const query=String(S.uniQuery||'').trim().toLowerCase(),city=String(S.uniCity||'').trim();let rows=(UNIVERSITIES||[]).filter(u=>uniAvailable(u,m));if(city)rows=rows.filter(u=>u.country===city);if(query)rows=rows.filter(u=>[u.name,u.city,u.country].some(v=>String(v||'').toLowerCase().includes(query)));rows=rows.map(u=>({...u,majorScore:uniStrength(u,m)}));const sort=S.uniSort||'match';if(sort==='name')rows.sort((a,b)=>a.name.localeCompare(b.name));else if(sort==='tuition')rows.sort((a,b)=>String(UNIVERSITY_TUITION[a.id]?.[1]||'No verified figure').localeCompare(String(UNIVERSITY_TUITION[b.id]?.[1]||'No verified figure')));else rows.sort((a,b)=>b.majorScore-a.majorScore||a.name.localeCompare(b.name));return rows;}
function uniResultsHtml(m){const rows=getUniversityRows(m),shown=rows.slice(0,24);return `${shown.length?`<div class="grid md:grid-cols-2 gap-4 mt-5">${shown.map(universityCard).join('')}</div>`:`<div class="bg-white/5 rounded-xl p-5 mt-5 text-sm text-slate-400">No universities match your current search. Try another country, city, or university name.</div>`}<div class="text-xs text-slate-500 uni-count">${rows.length} matching universities</div>`;}

function uniBox(m,countries){const sort=S.uniSort||'match',rows=getUniversityRows(m);return `<section class="glass rounded-2xl p-6 mt-8" id="university-finder"><div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4"><div><h2 class="text-2xl font-semibold">University finder</h2><p class="text-slate-500 mt-1">Explore universities that offer fields related to ${esc(m.name?.en||'this major')}.</p></div><div class="text-xs text-slate-500">${rows.length} matching universities</div></div><div class="grid md:grid-cols-[1fr_1fr_auto] gap-3 mt-5"><input id="uni-search" value="${esc(S.uniQuery||'')}" oninput="S.uniQuery=this.value;refreshUniversityResults()" placeholder="Search university or city…" class="glass rounded-xl px-4 py-3 outline-none w-full"><select onchange="S.uniCity=this.value;render()" class="glass rounded-xl px-4 py-3 outline-none w-full"><option value="">All countries</option>${(countries||[]).map(c=>`<option value="${esc(c)}" ${c===S.uniCity?'selected':''}>${esc(c)}</option>`).join('')}</select><select onchange="S.uniSort=this.value;render()" class="glass rounded-xl px-4 py-3 outline-none"><option value="match" ${sort==='match'?'selected':''}>Best match</option><option value="name" ${sort==='name'?'selected':''}>Name</option><option value="tuition" ${sort==='tuition'?'selected':''}>Tuition info</option></select></div><div id="uni-results">${rows.length?`<div class="grid md:grid-cols-2 gap-4 mt-5">${rows.slice(0,24).map(universityCard).join('')}</div>`:`<div class="bg-white/5 rounded-xl p-5 mt-5 text-sm text-slate-400">No universities match your current search. Try another country, city, or university name.</div>`}</div></section>`;}
function universityCard(u){const n=u.majorScore,site=officialUrl(u),meta=uniMeta(u),data=UNIVERSITY_TUITION[u.id]||['USD','Tuition benchmark not available','Research status'];const [currency,tuitionText,source]=data;const benchmark=/benchmark|comparison|source gap/i.test(source)||/benchmark/i.test(tuitionText);return `<div class="glass rounded-2xl p-5"><div class="flex justify-between gap-3"><div><h3 class="font-semibold">${esc(u.name)}</h3><div class="text-sm text-slate-500 mt-1">📍 ${esc(u.city)}, ${esc(u.country)}</div></div><div class="text-right"><div class="text-xl font-bold text-cyan-100">${n}/100</div><div class="text-[10px] text-slate-500">major strength</div></div></div><div class="mt-4 text-xs ${n>=90?'text-cyan-200':n>=80?'text-slate-300':'text-slate-400'}">${n>=90?'Excellent choice for this major.':n>=80?'Strong option for this major.':'Worth exploring for this major.'}</div><div class="grid sm:grid-cols-2 gap-2 mt-4"><div class="bg-white/5 rounded-xl p-3"><div class="text-[10px] uppercase tracking-wider text-slate-500">Annual tuition</div><div class="text-sm mt-1">${esc(tuitionText)}</div><div class="text-[10px] text-slate-500 mt-1">${benchmark?'Verified benchmark/comparison — exact university programme fee can differ.':'Published/source-checked figure — programme or fee status can change the exact amount.'}</div><div class="text-[10px] mt-1 ${benchmark?'text-amber-300':'text-emerald-300'}">${benchmark?'Benchmark / comparison':'Source-checked figure'} · ${esc(currency)}</div><div class="text-[10px] text-slate-600 mt-1">${esc(source)}</div></div><div class="bg-white/5 rounded-xl p-3"><div class="text-[10px] uppercase tracking-wider text-slate-500">Language</div><div class="text-sm mt-1">${esc(meta.language)}</div></div></div><div class="mt-4 grid grid-cols-2 gap-2">${site?`<a class="text-center text-xs rounded-xl bg-white/5 border border-white/10 py-2.5 hover:bg-white/10" target="_blank" rel="noopener noreferrer" href="${esc(site)}">University website ↗</a>`:`<button type="button" onclick="openOfficialSite('${esc(u.id)}')" class="text-center text-xs rounded-xl bg-white/5 border border-white/10 py-2.5 hover:bg-white/10">Official website ↗</button>`}<a class="text-center text-xs rounded-xl bg-white/5 border border-white/10 py-2.5 hover:bg-white/10" target="_blank" rel="noopener noreferrer" href="${mapUrl(u)}">Open location ↗</a></div></div>`}

function careerMeta(name){const exact=CAREER_META[name];if(exact)return exact;const n=String(name).toLowerCase();let annual=260000;let outlook='Steady demand';if(/software|developer|computer|programmer|data scientist|ai engineer|ml engineer|cloud|devops|cyber|security|robotics|quantitative|product engineer/.test(n)){annual=430000;outlook='Strong demand'}else if(/doctor|physician|surgeon|dentist|pharmacist/.test(n)){annual=650000;outlook='Strong demand'}else if(/nurse|therap|clinical|medical/.test(n)){annual=300000;outlook='Strong demand'}else if(/engineer|architect|scientist|researcher|economist|analyst/.test(n)){annual=330000;outlook='Steady demand'}else if(/account|finance|auditor|actuary|investment/.test(n)){annual=310000;outlook='Steady demand'}else if(/marketing|brand|sales|business|manager|hr|recruit/.test(n)){annual=250000;outlook='Steady demand'}else if(/teacher|educator|professor|curriculum/.test(n)){annual=210000;outlook='Steady demand'}else if(/designer|artist|writer|editor|journalist|photographer|actor|musician|filmmaker/.test(n)){annual=190000;outlook='Competitive field'}else if(/translator|interpreter|copywriter|content writer|data entry|telemarketer|customer service|bookkeeping|proofreading|administrative|paralegal/.test(n)){annual=150000;outlook='Changing field'}return {outlook,annual,source:'MajorMatch market benchmark; verify local listings'} }
function aiRisk(name){const n=String(name).toLowerCase();if(/translator|interpreter|copywriter|content writer|data entry|telemarketer|customer service|bookkeeping|proofreading|basic graphic|administrative assistant|paralegal/.test(n))return {label:'Highly threatened by AI',cls:'text-red-300'};if(/data|software|developer|programmer|account|marketing|analyst|designer|journalist|writer|computer|it /.test(n))return {label:'Somewhat threatened by AI',cls:'text-amber-300'};return {label:'Not threatened by AI',cls:'text-emerald-300'}}
const VERIFIED_SALARY={
  Egypt:{
    'Software Engineer':{entry:268678,mid:513252,senior:900000,currency:'EGP',source:'Levels.fyi Cairo, updated Sep 4 2026'},
    'Software Developer':{entry:268678,mid:513252,senior:900000,currency:'EGP',source:'Levels.fyi Cairo software-engineer benchmark, Sep 4 2026'}
  },
  'United Kingdom':{'Software Engineer':{entry:30000,mid:52000,senior:75000,currency:'GBP',source:'UK National Careers Service: £30k starter–£75k experienced'},'Software Developer':{entry:30000,mid:52000,senior:75000,currency:'GBP',source:'UK National Careers Service: £30k starter–£75k experienced'}},
  Canada:{'Software Engineer':{entry:60000,mid:117499,senior:190000,currency:'CAD',source:'Canada Job Bank median $56.49/hour; annualized at 2080 hours'},'Software Developer':{entry:60000,mid:117499,senior:190000,currency:'CAD',source:'Canada Job Bank median $56.49/hour; annualized at 2080 hours'}}
};
function salaryEstimate(name,country,experience='mid'){const row=VERIFIED_SALARY[country]?.[name];if(!row)return null;return {value:row[experience]||row.mid,currency:row.currency,source:row.source};}
function salaryModal(name){return `<div id="salary-modal" data-career="${esc(String(name))}" class="fixed inset-0 z-[100] bg-slate-950/80 backdrop-blur-sm grid place-items-center p-5"><div class="glass max-w-md w-full rounded-3xl p-7"><button type="button" data-close-salary class="float-right text-slate-400 text-xl">×</button><div class="text-cyan-200 text-xs uppercase tracking-[.18em]">Pay reference</div><h2 class="text-2xl font-semibold mt-2">${esc(name)}</h2><p class="text-slate-400 text-sm mt-2">Salary varies by country, role and experience. Tell us where you live and your experience level for an approximate average.</p><label class="block text-xs text-slate-500 mt-5">Country</label><select id="salary-country" class="glass w-full rounded-xl px-4 py-3 mt-2 bg-slate-950/80"><option value="">Choose your country…</option>${Object.keys(SALARY_COUNTRY).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select><label class="block text-xs text-slate-500 mt-4">Experience</label><select id="salary-experience" class="glass w-full rounded-xl px-4 py-3 mt-2 bg-slate-950/80"><option value="entry">Entry level (0–2 years)</option><option value="mid">Mid-career (3–7 years)</option><option value="senior">Senior (8+ years)</option></select><button type="button" data-calculate-salary class="btn mt-5 w-full bg-white text-slate-950 rounded-xl py-3 font-semibold">Calculate average →</button><div id="salary-result" class="mt-5"></div></div></div>`}
function openSalary(name){closeSalary();document.body.insertAdjacentHTML('beforeend',salaryModal(name));requestAnimationFrame(()=>document.getElementById('salary-country')?.focus())}
function normalizeCountry(v){const q=String(v||'').trim().toLowerCase();return Object.keys(SALARY_COUNTRY).find(c=>c.toLowerCase()===q)||Object.keys(SALARY_COUNTRY).find(c=>c.toLowerCase().includes(q))||null;}
function showSalary(name){const result=document.getElementById('salary-result'),raw=document.getElementById('salary-country')?.value,country=normalizeCountry(raw);if(!result)return;if(!country){result.innerHTML='<div class="bg-red-400/10 border border-red-300/20 rounded-2xl p-4 text-sm text-red-200">Please choose a country so we can calculate the average.</div>';return}const experience=document.getElementById('salary-experience')?.value||'mid',data=salaryEstimate(name,country,experience);if(!data){result.innerHTML='<div class="bg-amber-400/10 border border-amber-300/20 rounded-2xl p-4 text-sm text-amber-100">No verified salary figure is loaded for this exact career and country yet. I will not invent one.</div>';return}const annual=data.value,monthly=Math.round(annual/12),currency=data.currency,meta=careerMeta(name);result.innerHTML=`<div class="bg-white/5 rounded-2xl p-5"><div class="text-xs text-slate-500">Approximate gross salary in ${esc(country)}</div><div class="text-3xl font-bold text-cyan-100 mt-1">${currency} ${annual.toLocaleString()} / year</div><div class="text-lg font-semibold text-slate-300 mt-2">≈ ${currency} ${monthly.toLocaleString()} / month</div><div class="text-xs text-slate-500 mt-3">Experience: ${esc(experience)} · This is an annual figure; the monthly number is annual ÷ 12.</div><div class="text-[11px] text-slate-600 mt-2">${esc(data.source)}. Salary varies by city, employer, experience and specialization.</div></div>`}

function countryInfo(c){return COUNTRY_INFO[c]||{flag:'🌍',language:'Varies by institution',tuition:'Varies by university and program',note:'Check the university website for current requirements and fees.'};}
function countryPanel(c){const i=countryInfo(c);return `<div id="country-study-panel" class="glass rounded-2xl p-5 mt-5"><div class="text-cyan-200 text-xs uppercase tracking-[.18em]">Study in ${esc(c)}</div><div class="grid md:grid-cols-3 gap-3 mt-4"><div class="bg-white/5 rounded-xl p-4"><div class="text-2xl">${i.flag}</div><div class="text-xs text-slate-500 mt-2">Language</div><div class="text-sm mt-1">${esc(i.language)}</div></div><div class="bg-white/5 rounded-xl p-4"><div class="text-2xl">💰</div><div class="text-xs text-slate-500 mt-2">Tuition</div><div class="text-sm mt-1">${esc(i.tuition)}</div></div><div class="bg-white/5 rounded-xl p-4"><div class="text-2xl">📋</div><div class="text-xs text-slate-500 mt-2">Before applying</div><div class="text-sm mt-1">${esc(i.note)}</div></div></div></div>`;}
function careersPage(){S.page='careers';render();scrollTo(0,0);}
function openCareerMajor(id){const m=major(id);if(!m){toast('That major could not be found.');return}S.detail=id;S.page='detail';S.uniCity='';S.uniQuery='';render();scrollTo(0,0)}
function renderCareers(){
  const q=(S.careerQ||'').toLowerCase().trim();
  const rows=[];const seen=new Set();
  MAJORS.forEach(m=>(m.careerPaths||[]).forEach(name=>{if(!seen.has(name)){seen.add(name);rows.push({name,major:m});}}));

}
function renderDetail(){
  const m=major(S.detail);
  if(!m){ S.page='results'; return results(); }
  const safeScore=()=>{try{return match(m)}catch{return 0}};
  const safeWhy=()=>{try{return why(m)}catch{return []}};
  const safeRel=()=>{try{return alternativeMajors(m)||[]}catch{return []}};
  const safeCourses=()=>{try{return likelyCourses(m)||[]}catch{return []}};
  const careers=Array.isArray(m.careerPaths)?m.careerPaths:[];
  const skills=Array.isArray(m.skills)?m.skills:[];
  const tags=Array.isArray(m.interestTags)?m.interestTags:[];
  const subjects=m.subjects&&typeof m.subjects==='object'?m.subjects:{};
  const firstSubject=Object.keys(subjects)[0];
  const icon=(sub(firstSubject)||{}).icon||'✦';
  const rel=safeRel(), courses=safeCourses(), score=safeScore();
  const countries=[...new Set(UNIVERSITIES.map(u=>u.country).filter(Boolean))].sort();
  let universities='';
  try{universities=uniBox(m,countries)}catch(e){console.warn('University finder unavailable:',e);universities='<div class="glass rounded-2xl p-6 mt-8"><h2 class="font-semibold">University finder</h2><p class="text-slate-500 mt-2">University data could not be displayed for this major.</p></div>'}
  return `<section class="pt-32 pb-20 min-h-screen"><div class="max-w-5xl mx-auto px-5">
    <button type="button" onclick="backFromDetail()" class="text-sm text-slate-400">← Back to matches</button>
    <div class="glass rounded-[2rem] p-7 sm:p-10 mt-5">
      <div class="flex flex-col sm:flex-row gap-6"><div class="w-20 h-20 rounded-3xl bg-white/5 grid place-items-center text-4xl">${icon}</div><div class="flex-1"><div class="text-cyan-200 text-sm">${esc(category(m.category||''))}</div><h1 class="text-4xl sm:text-5xl font-semibold mt-1">${esc(m.name?.en||'Major')}</h1><p class="text-slate-400 text-lg mt-4">${esc(m.description||'Explore this major and its possible pathways.')}</p></div><div class="text-5xl font-bold text-grad">${score}%</div></div>
      <div class="grid md:grid-cols-2 gap-4 mt-9"><div class="bg-white/5 rounded-2xl p-5"><h2 class="font-semibold">Why it matches you</h2><div class="space-y-2 mt-4 text-sm text-slate-300">${safeWhy().map(x=>`<div>${esc(x)}</div>`).join('')||'<div class="text-slate-500">Explore this major and compare it with your interests.</div>'}</div></div><div class="bg-white/5 rounded-2xl p-5"><h2 class="font-semibold">You might enjoy</h2><div class="flex flex-wrap gap-2 mt-4">${tags.map(x=>`<span class="px-3 py-1.5 rounded-full bg-cyan-300/10 text-cyan-100 text-xs">${esc(String(x).replaceAll('_',' '))}</span>`).join('')||'<span class="text-slate-500 text-sm">A broad mix of skills and interests.</span>'}</div></div></div>
      <div class="grid md:grid-cols-2 gap-4 mt-4"><div class="bg-white/5 rounded-2xl p-5"><h2 class="font-semibold">Skills involved</h2><div class="grid grid-cols-2 gap-2 mt-4 text-sm text-slate-400">${skills.map(x=>`<div>• ${esc(x)}</div>`).join('')||'<div class="text-slate-500">Varies by university.</div>'}</div></div><div class="bg-white/5 rounded-2xl p-5"><h2 class="font-semibold">Possible careers</h2><div class="space-y-2 mt-4 text-sm text-slate-400">${careers.map(x=>`<button type="button" onclick="careerSearch(${JSON.stringify(String(x))})" class="block hover:text-cyan-200">→ ${esc(x)}</button>`).join('')||'<div class="text-slate-500">Career options vary by specialization.</div>'}</div></div></div>
      <div class="glass rounded-2xl p-5 mt-4"><div class="flex items-end justify-between gap-3"><div><div class="text-cyan-200 text-xs uppercase tracking-[.18em]">Career outlook</div><h2 class="text-2xl font-semibold mt-1">Where could this major take you?</h2><p class="text-sm text-slate-500 mt-2">Explore possible careers, demand, AI exposure, and an estimated salary for your country.</p></div><button type="button" onclick="careersPage()" class="text-xs text-cyan-200 hover:underline shrink-0">Explore all careers →</button></div><div class="grid md:grid-cols-3 gap-3 mt-5">${(careers.length?careers.slice(0,3):['Related career','Specialist','Professional']).map(name=>{let meta=careerMeta(name),risk=aiRisk(name);return `<div class="bg-white/5 rounded-xl p-4 border border-white/5"><div class="font-semibold text-sm">${esc(name)}</div><button type="button" data-open-salary="${esc(String(name))}" aria-label="Check average salary for ${esc(String(name))} in my country" class="text-left w-full cursor-pointer group"><div class="text-xs text-slate-500 mt-3">Pay reference</div><div class="text-sm mt-1 text-cyan-100 group-hover:underline">Check average for my country →</div></button><div class="text-xs text-slate-500 mt-3">Outlook</div><div class="text-sm mt-1 text-cyan-100">${esc(meta.outlook)}</div><div class="text-xs mt-3 ${risk.cls}">⚠️ ${esc(risk.label)}</div></div>`}).join('')}</div><p class="text-[11px] text-slate-600 mt-4">Salary estimates are provided only after you enter your country and experience. AI-risk labels are MajorMatch orientation labels, not guarantees.</p></div>
      <div class="glass rounded-2xl p-5 mt-4"><div class="text-cyan-200 text-xs uppercase tracking-[.18em]">What you may study</div><h2 class="text-2xl font-semibold mt-1">A preview of the academic experience</h2><p class="text-slate-500 text-sm mt-2">Typical subjects vary by university, but these are common areas to expect.</p><div class="flex flex-wrap gap-2 mt-4">${courses.map(x=>`<span class="px-3 py-2 rounded-xl bg-white/5 text-sm text-slate-300">${esc(x)}</span>`).join('')}</div></div>
      ${rel.length?`<div class="glass rounded-2xl p-5 mt-4"><div class="text-cyan-200 text-xs uppercase tracking-[.18em]">Explore alternatives</div><h2 class="text-2xl font-semibold mt-1">If you like this, also consider…</h2><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 mt-5">${rel.map(r=>`<button type="button" data-major-id="${esc(r.id)}" class="js-explore-major bg-white/5 rounded-2xl p-4 text-left hover:bg-white/10"><div class="text-xs text-cyan-200">${esc(category(r.category||''))}</div><div class="font-semibold mt-1">${esc(r.name?.en||'Major')}</div><div class="text-xs text-slate-500 mt-2">Explore this alternative →</div></button>`).join('')}</div></div>`:''}
      <div class="flex gap-2 mt-7"><button type="button" onclick="save('${esc(m.id)}')" class="btn bg-white text-slate-950 rounded-xl px-5 py-3 font-semibold">${S.saved.includes(m.id)?'♥ Saved':'♡ Save Major'}</button><button type="button" onclick="compare('${esc(m.id)}')" class="glass rounded-xl px-5 py-3">${S.compare.includes(m.id)?'✓ Comparing':'＋ Compare'}</button></div>
      ${universities}
    </div></div></section>`;
}
function backFromDetail(){S.page='results';render();scrollTo(0,0)}
function careerSearch(name){S.careerQ=name;S.page='careers';render();scrollTo(0,0)}

function renderSaved(){let a=S.saved.map(major).filter(Boolean).map(m=>({...m,score:match(m)}));return`<section class="pt-32 pb-20 min-h-screen"><div class="max-w-7xl mx-auto px-5"><p class="text-cyan-200 text-sm uppercase tracking-[.2em]">Your shortlist</p><h1 class="text-5xl sm:text-6xl font-semibold mt-2">My Saved Majors</h1><p class="text-slate-400 mt-4">Saved locally on this device — no account required.</p>${a.length?`<div class="grid lg:grid-cols-2 gap-4 mt-8">${a.map(card).join('')}</div>`:`<div class="glass rounded-3xl p-14 text-center mt-8"><div class="text-4xl">♡</div><h2 class="text-xl font-semibold mt-4">You haven't saved any majors yet.</h2><p class="text-slate-500 mt-2">Tap ♡ on a major to keep it here.</p><button onclick="start()" class="btn mt-6 bg-white text-slate-950 rounded-xl px-5 py-3 font-semibold">Find My Majors →</button></div>`}</div></section>`}
function render(){try{let x=S.page==='home'?renderHome():S.page==='subjects'?renderSubjects():S.page==='prefs'?renderPrefs():S.page==='calc'?renderCalc():S.page==='results'?results():S.page==='detail'?renderDetail():S.page==='careers'?renderCareers():renderSaved();document.getElementById('app').innerHTML=x;persist()}catch(err){console.error('MajorMatch render error:',err);toast('Something went wrong loading this page. Please try again.');if(S.page!=='home'){S.page='home';try{document.getElementById('app').innerHTML=renderHome();persist()}catch(e){document.getElementById('app').innerHTML='<div style="padding:140px 24px;text-align:center">Unable to load MajorMatch. Please refresh.</div>'}}else document.getElementById('app').innerHTML='<div style="padding:140px 24px;text-align:center">Unable to load MajorMatch. Please refresh.</div>'}}
// Render the homepage BEFORE any optional 3D library loads. This is the v12-style boot fix: the app is never blocked by WebGL/CDN failures.
S.page='home';S.detail=null;S.uniCity='';S.uniQuery='';S.cat='All';
render();
function initThreeBackground(){if(window.__mmThreeStarted||!window.THREE)return;window.__mmThreeStarted=true;try{const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,mobile=innerWidth<700,c=document.getElementById('three'),r=new THREE.WebGLRenderer({canvas:c,alpha:true,antialias:!mobile});r.setPixelRatio(Math.min(devicePixelRatio,mobile?1.2:1.6));r.setSize(innerWidth,innerHeight);const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);cam.position.z=10;const g=new THREE.Group();sc.add(g);const a=new THREE.MeshBasicMaterial({color:0x5ee7f2,wireframe:true,transparent:true,opacity:.15}),b=new THREE.MeshBasicMaterial({color:0x9b8cff,wireframe:true,transparent:true,opacity:.11});function add(o,m,p,s=1){o.position.set(...p);o.scale.setScalar(s);g.add(o)}add(new THREE.IcosahedronGeometry(1.6,1),a,[-4,1,-1],.9);add(new THREE.TorusKnotGeometry(1.1,.025,80,10),b,[3,2,-2]);add(new THREE.TorusGeometry(1.8,.018,16,80),a,[-3,-4,-1]);add(new THREE.OctahedronGeometry(1.1,1),b,[4,-3,-3]);let n=mobile?220:450,pts=new Float32Array(n*3);for(let i=0;i<n;i++){pts[i*3]=(Math.random()-.5)*18;pts[i*3+1]=(Math.random()-.5)*12;pts[i*3+2]=(Math.random()-.5)*10-2}let pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pts,3));sc.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x8bdde7,size:mobile?.018:.023,transparent:true,opacity:.4})));let target=0;addEventListener('scroll',()=>target=scrollY*.0005);function loop(){requestAnimationFrame(loop);if(!reduce){g.rotation.y+=(target-g.rotation.y)*.02;g.rotation.x+=.0005;g.rotation.z+=.00025}r.render(sc,cam)}loop();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})}catch(e){console.warn('3D background disabled:',e)}}
// Load Three.js after the UI is already visible; failure simply leaves the static dark background.
setTimeout(()=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js';script.async=true;script.onload=initThreeBackground;document.head.appendChild(script)},0);
// Explore-major navigation uses event delegation so it survives every results re-render.
document.addEventListener('click',function(event){const button=event.target.closest('.js-explore-major[data-major-id]');if(!button)return;event.preventDefault();const id=button.getAttribute('data-major-id');if(!id||!major(id)){toast('This major could not be opened.');return}S.detail=id;S.uniCity='';S.uniQuery='';S.page='detail';render();window.scrollTo({top:0,behavior:'smooth'});});
document.addEventListener('click',function(event){
  const salaryTrigger=event.target.closest('[data-open-salary]');
  if(salaryTrigger){event.preventDefault();openSalary(salaryTrigger.getAttribute('data-open-salary')||'');return;}
  if(event.target.closest('[data-close-salary]')){closeSalary();return;}
  const calc=event.target.closest('[data-calculate-salary]');
  if(calc){event.preventDefault();const modal=document.getElementById('salary-modal');showSalary(modal?.getAttribute('data-career')||'');return;}
});
window.detail=detail;
// Always boot on the Home page. Do not restore transient navigation state.
S.page='home';S.detail=null;S.uniCity='';S.uniQuery='';S.cat='All';
try{render();window.scrollTo(0,0)}catch(e){console.error(e);document.getElementById('app').innerHTML=renderHome();}

</script>
